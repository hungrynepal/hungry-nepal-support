<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 60" fill="none" width="250" height="60">
  <defs>
    <linearGradient id="hh-red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>
  </defs>
  <!-- Brand Emblem -->
  <g transform="translate(6, 6)">
    <!-- Steam / Aroma waves -->
    <path d="M16 10 C14 6, 18 4, 16 0" stroke="#DC2626" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M24 11 C22 7, 26 5, 24 1" stroke="#E11D48" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M32 10 C30 6, 34 4, 32 0" stroke="#DC2626" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85"/>
    
    <!-- Bowl Rim -->
    <ellipse cx="24" cy="18" rx="16" ry="3.5" fill="#9F1239" />
    <ellipse cx="24" cy="17" rx="14" ry="2.5" fill="#DC2626" />
    
    <!-- Bowl Body -->
    <path d="M10 18 Q6 28, 12 38 Q24 46, 36 38 Q42 28, 38 18 Z" fill="url(#hh-red-grad)" />
    <!-- Decorative ring -->
    <path d="M12 26 Q24 31, 36 26" stroke="#FFE4E6" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- Bowl Base -->
    <ellipse cx="24" cy="42" rx="11" ry="2.5" fill="#881337" />
  </g>
  
  <!-- Text Lockup -->
  <text x="64" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#1C1917" letter-spacing="-0.5">Hungry</text>
  <text x="146" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#DC2626" letter-spacing="-0.5">Hetauda</text>
  <text x="65" y="46" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="9" fill="#78716C" letter-spacing="1.5">FOOD DELIVERY &amp; MEALS</text>
</svg>
